version: 1
clouds:
  aws:
    enabled: true
    interval: 300
    identity: sdk_chain
    regions: [eu-central-1]
    metrics:
      - namespace: AWS/RDS
        metric_name: DatabaseConnections
        stat: Maximum
  azure:
    enabled: false
    interval: 300
    identity: workload_identity
    metrics:
      - service: Microsoft.Compute/virtualMachines
        metric: Percentage CPU
  gcp:
    enabled: false
    interval: 300
    identity: adc
    metrics:
      - compute.googleapis.com/instance/cpu/utilization
