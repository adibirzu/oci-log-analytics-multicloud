# Generated by collectors/otel/generate.py. Do not edit by hand.
# identity: aws=web_identity, azure=managed_identity, gcp=workload_identity (no static credentials)
receivers:
  awscloudwatch/eu-central-1:
    region: eu-central-1
    metrics:
      collection_interval: 300s
      period: 300s
      queries:
      - namespace: AWS/EC2
        metric_name: CPUUtilization
        stats: Average
  awscloudwatch/us-east-1:
    region: us-east-1
    metrics:
      collection_interval: 300s
      period: 300s
      queries:
      - namespace: AWS/EC2
        metric_name: CPUUtilization
        stats: Average
  azuremonitor:
    subscription_ids:
    - ${env:AZURE_SUBSCRIPTION_ID}
    auth:
      authenticator: azureauth
    collection_interval: 600s
    services:
    - Microsoft.Compute/virtualMachines
    - Microsoft.Storage/storageAccounts
    metrics:
      microsoft.compute/virtualmachines:
        Percentage CPU: []
      microsoft.storage/storageaccounts:
        Transactions: []
  googlecloudmonitoring:
    project_id: ${env:GCP_PROJECT_ID}
    collection_interval: 300s
    metrics_list:
    - metric_name: compute.googleapis.com/instance/cpu/utilization
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  resource/aws:
    attributes:
    - key: cloud.provider
      value: aws
      action: upsert
  resource/azure:
    attributes:
    - key: cloud.provider
      value: azure
      action: upsert
  resource/gcp:
    attributes:
    - key: cloud.provider
      value: gcp
      action: upsert
  batch: {}
exporters:
  otlphttp/bridge:
    endpoint: ${env:METRICS_BRIDGE_ENDPOINT}
  otlphttp/apm:
    metrics_endpoint: ${env:OCI_APM_ENDPOINT}/20200101/opentelemetry/v1/metrics
    headers:
      Authorization: dataKey ${env:OCI_APM_PRIVATE_DATAKEY}
service:
  pipelines:
    metrics/aws:
      receivers:
      - awscloudwatch/eu-central-1
      - awscloudwatch/us-east-1
      processors:
      - memory_limiter
      - resource/aws
      - batch
      exporters:
      - otlphttp/bridge
      - otlphttp/apm
    metrics/azure:
      receivers:
      - azuremonitor
      processors:
      - memory_limiter
      - resource/azure
      - batch
      exporters:
      - otlphttp/bridge
      - otlphttp/apm
    metrics/gcp:
      receivers:
      - googlecloudmonitoring
      processors:
      - memory_limiter
      - resource/gcp
      - batch
      exporters:
      - otlphttp/bridge
      - otlphttp/apm
  extensions:
  - azureauth
extensions:
  azureauth:
    managed_identity: {}
