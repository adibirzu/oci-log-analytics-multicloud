[project]
name = "oci-log-analytics-multicloud"
version = "0.1.0"
description = "Centralize AWS, Azure and GCP logs, metrics and traces in OCI Log Analytics, Monitoring and APM."
requires-python = ">=3.11"
license = { text = "UPL-1.0" }
dependencies = ["PyYAML>=6,<7", "oci>=2.181.1,<3", "typer>=0.12", "opentelemetry-proto>=1.27", "protobuf>=5"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
azure = ["azure-eventhub>=5.12,<6", "azure-identity>=1.17,<2", "azure-eventhub-checkpointstoreblob>=1.1,<2"]
gcp = ["google-cloud-pubsub>=2.23,<3", "google-auth>=2.30,<3"]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.6"]

[project.scripts]
mcctl = "mcctl.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
