name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev,aws,azure,gcp]'
      - run: python -m pytest -q

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry owner (GHCR requires lowercase)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push logs collector
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/logs-collector.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/oci-la-mc-logs-collector:${{ steps.ver.outputs.version }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/oci-la-mc-logs-collector:latest', steps.owner.outputs.lc) || '' }}
      - name: Build and push metrics bridge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: container/metrics-bridge.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/oci-la-mc-metrics-bridge:${{ steps.ver.outputs.version }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/oci-la-mc-metrics-bridge:latest', steps.owner.outputs.lc) || '' }}

  release:
    needs: [test, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase registry owner (GHCR requires lowercase)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Package ORM zip
        env:
          IMAGE_REGISTRY: ghcr.io/${{ steps.owner.outputs.lc }}
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/build_orm_zip.sh
      - name: Attach ORM zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/oci-log-analytics-multicloud-orm.zip
